<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1140 320" width="1140" height="320">
  <defs>
    <style>
      .title { font-family: 'Inter', system-ui, sans-serif; font-weight: 700; fill: #0f172a; }
      .sub { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: #64748b; }
      .card-title { font-family: 'Inter', system-ui, sans-serif; font-size: 13.5px; font-weight: 700; fill: #0f172a; }
      .card-link { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; font-weight: 600; fill: #dc2626; }
      .btn-grid-lbl { font-family: 'Inter', system-ui, sans-serif; font-size: 11.5px; font-weight: 600; fill: #ffffff; }
      .btn-grid-lbl-red { font-family: 'Inter', system-ui, sans-serif; font-size: 11.5px; font-weight: 600; fill: #dc2626; }
    </style>
  </defs>

  <rect width="1140" height="320" fill="#f8fafc"/>

  <text x="32" y="36" class="title" font-size="18">Bulk Orders — Pinned Docked Control Panel (Thanh điều khiển cố định)</text>
  <text x="32" y="56" class="sub">Cố định ở đáy màn hình khi cuộn bảng tính lên/xuống. Khít lề sidebar 220px, màu nền trắng tinh khôi (#ffffff)</text>

  <!-- Pinned Panel -->
  <g transform="translate(32, 75)">
    <rect width="1076" height="225" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>

    <!-- Row 1: Status Bar -->
    <g transform="translate(16, 12)">
      <rect width="1044" height="42" rx="8" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>

      <!-- Left: Draft selector & timestamp -->
      <g transform="translate(16, 26)">
        <text x="0" y="0" font-family="'Inter', sans-serif" font-size="13" font-weight="700" fill="#0F172A">Lưu nháp:</text>

        <!-- Radio Tu Dong -->
        <circle cx="85" cy="-4" r="6" fill="none" stroke="#64748B" stroke-width="1.5"/>
        <text x="96" y="0" font-family="'Inter', sans-serif" font-size="12.5" fill="#334155">Tự động</text>

        <!-- Radio Thu Cong (Active) -->
        <circle cx="165" cy="-4" r="6" fill="none" stroke="#E11D48" stroke-width="1.5"/>
        <circle cx="165" cy="-4" r="3" fill="#E11D48"/>
        <text x="176" y="0" font-family="'Inter', sans-serif" font-size="12.5" font-weight="600" fill="#0F172A">Thủ công</text>

        <!-- Timestamp -->
        <text x="255" y="0" font-family="'Inter', sans-serif" font-size="13" font-weight="700" fill="#0F172A">14/09/2026 - 12:08:24</text>
      </g>

      <!-- Right: Action Triggers -->
      <g transform="translate(560, 6)">
        <!-- Find Errors -->
        <g transform="translate(0, 0)">
          <rect width="200" height="30" rx="6" fill="#FFFFFF" stroke="#EF4444" stroke-width="1.5"/>
          <g transform="translate(10, 7) scale(0.625)" color="#EF4444"><path d="M2.062 12.348a1 1 0 0 1 0-.696 10.75 10.75 0 0 1 19.876 0 1 1 0 0 1 0 .696 10.75 10.75 0 0 1-19.876 0" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="12" cy="12" r="3" fill="none" stroke="currentColor" stroke-width="2"/></g>
          <text x="32" y="19" font-family="'Inter', sans-serif" font-size="12" font-weight="600" fill="#EF4444">Tìm Ô Chưa Điền [0]</text>
        </g>

        <!-- Check Data -->
        <g transform="translate(210, 0)">
          <rect width="135" height="30" rx="6" fill="#EF4444"/>
          <text x="14" y="19" font-family="'Inter', sans-serif" font-size="12" font-weight="700" fill="#FFFFFF">✓ Kiểm Tra Dữ Liệu</text>
        </g>

        <!-- Create Bulk -->
        <g transform="translate(355, 0)">
          <rect width="120" height="30" rx="6" fill="#16A34A"/>
          <text x="12" y="19" font-family="'Inter', sans-serif" font-size="12" font-weight="700" fill="#FFFFFF">Tạo Nhiều Đơn</text>
        </g>
      </g>
    </g>

    <!-- Row 2: 3 Cards Grid -->
    <g transform="translate(16, 64)">
      <!-- Card 1: 2x3 Buttons (width 430) -->
      <g transform="translate(0, 0)">
        <rect width="430" height="145" rx="8" fill="#FFFFFF" stroke="#E2E8F0"/>

        <!-- Top 3 Buttons -->
        <g transform="translate(12, 16)">
          <!-- Save Draft -->
          <rect width="128" height="48" rx="6" fill="#0284C7"/>
          <g transform="translate(10, 16) scale(0.625)" color="#FFFFFF"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><polyline points="17 21 17 13 7 13 7 21" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><polyline points="7 3 7 8 15 8" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></g>
          <text x="32" y="30" class="btn-grid-lbl">Lưu Nháp</text>

          <!-- Restore -->
          <g transform="translate(138, 0)">
            <rect width="128" height="48" rx="6" fill="#16A34A"/>
            <g transform="translate(8, 16) scale(0.625)" color="#FFFFFF"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M3 3v5h5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></g>
            <text x="28" y="30" class="btn-grid-lbl">Khôi Phục</text>
          </g>

          <!-- Add Rows -->
          <g transform="translate(276, 0)">
            <rect width="130" height="48" rx="6" fill="#EA580C"/>
            <g transform="translate(8, 16) scale(0.625)" color="#FFFFFF"><path d="M5 12h14" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><path d="M12 5v14" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></g>
            <text x="28" y="30" class="btn-grid-lbl">Thêm Dòng</text>
          </g>
        </g>

        <!-- Bottom 3 Buttons (Outlined Red) -->
        <g transform="translate(12, 78)">
          <!-- Toggle Guide -->
          <rect width="128" height="48" rx="6" fill="#FFFFFF" stroke="#EF4444" stroke-width="1.2"/>
          <g transform="translate(10, 16) scale(0.625)" color="#DC2626"><circle cx="12" cy="12" r="10" fill="none" stroke="currentColor" stroke-width="2"/><line x1="12" x2="12" y1="16" y2="12" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><line x1="12" x2="12.01" y1="8" y2="8" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></g>
          <text x="30" y="30" class="btn-grid-lbl-red">Ẩn/Hiện HD</text>

          <!-- Return Home -->
          <g transform="translate(138, 0)">
            <rect width="128" height="48" rx="6" fill="#FFFFFF" stroke="#EF4444" stroke-width="1.2"/>
            <g transform="translate(8, 16) scale(0.625)" color="#DC2626"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><polyline points="9 22 9 12 15 12 15 22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></g>
            <text x="28" y="30" class="btn-grid-lbl-red">Trang Chủ</text>
          </g>

          <!-- Defaults -->
          <g transform="translate(276, 0)">
            <rect width="130" height="48" rx="6" fill="#FFFFFF" stroke="#EF4444" stroke-width="1.2"/>
            <g transform="translate(8, 16) scale(0.625)" color="#DC2626"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="12" cy="12" r="3" fill="none" stroke="currentColor" stroke-width="2"/></g>
            <text x="28" y="30" class="btn-grid-lbl-red">Cấu Hình</text>
          </g>
        </g>
      </g>

      <!-- Card 2: Shipping Method (width 270) -->
      <g transform="translate(442, 0)">
        <rect width="270" height="145" rx="8" fill="#FFFFFF" stroke="#BFDBFE"/>
        <!-- Header -->
        <g transform="translate(14, 22)">
          <g transform="translate(0, -4) scale(0.75)" color="#2563EB"><path d="M14 18V6a2 2 0 0 0-2-2H4a2 2 0 0 0-2 2v11a1 1 0 0 0 1 1h2" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M15 18H9" stroke="currentColor" stroke-width="2"/><path d="M19 18h2a1 1 0 0 0 1-1v-3.65a1 1 0 0 0-.22-.62l-3.23-4.27a1 1 0 0 0-.78-.46H14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="7" cy="18" r="2" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="17" cy="18" r="2" fill="none" stroke="currentColor" stroke-width="2"/></g>
          <text x="26" y="10" class="card-title">Phương thức</text>
          <text x="195" y="10" class="card-link">Thay đổi</text>
        </g>

        <!-- Content -->
        <g transform="translate(14, 66)">
          <text x="0" y="0" font-family="'Inter', sans-serif" font-size="12" fill="#E11D48">Một nhà vận chuyển mặc định</text>
          <text x="0" y="26" font-family="'Inter', sans-serif" font-size="15" font-weight="800" fill="#0284C7">SPX Express</text>
        </g>
      </g>

      <!-- Card 3: Pickup Address (width 320) -->
      <g transform="translate(724, 0)">
        <rect width="320" height="145" rx="8" fill="#FFFFFF" stroke="#FECDD3"/>
        <!-- Header -->
        <g transform="translate(14, 22)">
          <g transform="translate(0, -4) scale(0.75)" color="#E11D48"><path d="M20 10c0 4.993-5.539 10.193-7.399 11.799a1 1 0 0 1-1.202 0C9.539 20.193 4 14.993 4 10a8 8 0 0 1 16 0" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="12" cy="10" r="3" fill="none" stroke="currentColor" stroke-width="2"/></g>
          <text x="26" y="10" class="card-title">Địa chỉ lấy hàng</text>
          <text x="245" y="10" class="card-link">Thay đổi</text>
        </g>

        <!-- Content -->
        <g transform="translate(14, 58)">
          <text x="0" y="0" font-family="'Inter', sans-serif" font-size="11.5" fill="#334155">231/15 Dương Bá Trạc, Phường 01,</text>
          <text x="0" y="18" font-family="'Inter', sans-serif" font-size="11.5" fill="#334155">Quận 8, Thành phố Hồ Chí Minh</text>
          <text x="0" y="44" font-family="'Inter', sans-serif" font-size="12.5" font-weight="700" fill="#0F172A">S275518 - AB - 039****077</text>
          <g transform="translate(175, 30) scale(0.5833333333333334)" color="#64748B"><path d="M2.062 12.348a1 1 0 0 1 0-.696 10.75 10.75 0 0 1 19.876 0 1 1 0 0 1 0 .696 10.75 10.75 0 0 1-19.876 0" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="12" cy="12" r="3" fill="none" stroke="currentColor" stroke-width="2"/></g>
        </g>
      </g>
    </g>
  </g>
</svg>